name: CI/CD for simple-http-checker

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

jobs:
  lint-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Display Python version and location
        run: |
          python --version
          which python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install  ".[dev ]" pytest
      - name: Linting and format checks 
        run: |
          ruff check . 
          black --check .
      - name: Static type checking
        run: |
          mypy src/
      - name : Security checks
        run: |
          bandit -c pyproject.toml -r .
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
         python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ."[dev]" pytest
      - name: Run tests
        run: |
          python -m pytest
  release:
    runs-on: ubuntu-latest
    needs: [lint-static-checks, tests]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-semantic-release build 
      - name: Create release
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
          semantic-release publish
