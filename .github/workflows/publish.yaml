name : Publish to PyPi
on:
  workflow_dispatch:
  release:
    types: [published]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Display Python version and location
        run: |
          python --version
          which python
      - name: Install dependencies
        run: |
           python -m pip install --upgrade pip
           python -m pip uninstall -y build
           python -m pip install --no-cache-dir build
           python -m pip install ".[dev]" pytest
      - name: Verify build installation
        run: |
           python -m pip show build
           python -c "import build; print(build.__file__)"
      - name: Build package
        run: |
          python -m build
      - name: Upload build artifacts 
        uses: actions/upload-artifact@v4
        with:
          name: simple-http-checker-${{ github.sha}}
          path: dist/
  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: development
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: simple-http-checker-${{ github.sha}}   
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: simple-http-checker-${{ github.sha}}   
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true